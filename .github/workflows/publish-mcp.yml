name: Publish to MCP Registry

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Publish to MCP Registry
        uses: OtherVibes/mcp-publish-action@v1
        with:
          name: io.github.Ashutos1997/ffmpeg-mcp-server
          description: "FFmpeg & FFprobe media processing toolkit for video, audio, and social formats"
          version: "0.4.1"
          registry_type: npm
          identifier: "@ash_j1997/ffmpeg-mcp-server"
          transport_type: stdio
